name: Kernel Candidate

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/kernel/**"
      - "tests/test_kernel_artifact_verifier.py"
      - ".github/workflows/kernel-candidate.yml"
  pull_request:
    paths:
      - "bootstrap/kernel/**"
      - "tests/test_kernel_artifact_verifier.py"
      - ".github/workflows/kernel-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install measured kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config

      - name: Validate kernel source/config contract
        run: python bootstrap/kernel/build.py check

      - name: Run kernel artifact verifier regressions
        run: python -m unittest discover -s tests -p 'test_kernel_artifact_verifier.py' -v

      - name: Build kernel candidate with provenance
        run: python bootstrap/kernel/build.py build --jobs 4

      - name: Verify kernel candidate artifacts
        run: python bootstrap/kernel/verify.py out/kernel

      - name: Upload kernel candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-kernel-${{ github.sha }}
          path: out/kernel/
          if-no-files-found: error
          retention-days: 14

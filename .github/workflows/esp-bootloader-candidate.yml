name: ESP Bootloader Candidate

on:
  push:
    branches: [main]
    paths:
      - 'boot/esp/**'
      - '.github/workflows/esp-bootloader-candidate.yml'
  pull_request:
    paths:
      - 'boot/esp/**'
      - '.github/workflows/esp-bootloader-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp-bootloader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout OrdaX source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install systemd-boot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc binutils pkg-config gperf \
            libcap-dev libmount-dev libblkid-dev libssl-dev \
            liblz4-dev libzstd-dev liblzma-dev libpcre2-dev
          python -m pip install --disable-pip-version-check --no-cache-dir \
            jinja2 pyelftools

      - name: Validate ESP source contract
        run: python boot/esp/build.py check

      - name: Build pinned systemd-boot candidate
        run: python boot/esp/build.py build

      - name: Verify ESP bootloader candidate
        run: python boot/esp/build.py verify

      - name: Upload ESP bootloader candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-esp-bootloader-${{ github.sha }}
          path: out/esp/
          if-no-files-found: error
          retention-days: 14

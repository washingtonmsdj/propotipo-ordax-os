name: Creator Component Candidate

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/trust/release-ed25519.json'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/creator-component-channel.json'
      - 'tools/creator/componentchannel/**'
      - 'tools/creator/cmd/ordax-creator-inspection/**'
      - 'tools/creator/host/windows/**'
      - 'tools/release-signing/cmd/ordax-creator-component-signing/**'
      - '.github/workflows/creator-component-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-and-contract-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      version: ${{ steps.gate.outputs.version }}
      release_sequence: ${{ steps.gate.outputs.release_sequence }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require canonical trust and explicit component candidate state
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          version=''
          release_sequence=''
          if [ -f bootstrap/trust/release-ed25519.json ]; then
            readarray -t values < <(python - <<'PY'
          import base64, json, pathlib, re
          trust = json.loads(pathlib.Path('bootstrap/trust/release-ed25519.json').read_text(encoding='utf-8'))
          policy = json.loads(pathlib.Path('docs/contracts/release-trust-policy.json').read_text(encoding='utf-8'))
          contract = json.loads(pathlib.Path('docs/contracts/creator-component-channel.json').read_text(encoding='utf-8'))
          assert trust['$schema'] == 'prototype-ordax.release-trust/1'
          assert trust['key_id'] == policy['canonical_key_id'] == 'ordax-prototype-release-v1'
          assert len(base64.b64decode(trust['public_key_base64'], validate=True)) == 32
          assert policy['gates']['key_material_generated'] is True
          assert policy['gates']['public_anchor_pinned'] is True
          assert contract['$schema'] == 'prototype-ordax.creator-component-channel/1'
          assert contract['status'] == 'candidate-enabled'
          assert contract['purpose'] == 'creator-inspection-windows-amd64'
          assert contract['source_repository'] == 'washingtonmsdj/prototipo-ordax-os'
          assert contract['release_tag'] == 'creator-components'
          assert contract['bundle_name'] == 'ordax-creator-components-windows-amd64.zip'
          assert contract['envelope_name'] == 'creator-component-envelope.json'
          assert contract['created_from_recipe'] == 'creator/component/windows/1'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', contract['version'])
          assert isinstance(contract['release_sequence'], int) and not isinstance(contract['release_sequence'], bool) and contract['release_sequence'] > 0
          assert contract['canonical_public_trust_required'] is True
          assert contract['ed25519_signature_required'] is True
          assert contract['development_fallback_allowed_in_official_creator'] is False
          assert contract['raw_disk_writer_allowed'] is False
          assert contract['publisher_private_key_in_consumer'] is False
          assert contract['publisher_private_key_in_ci_artifact'] is False
          assert contract['unsigned_manifest_may_activate_official_component'] is False
          assert contract['publish_allowed'] is False
          print(contract['version'])
          print(contract['release_sequence'])
          PY
            )
            version="${values[0]}"
            release_sequence="${values[1]}"
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_sequence=$release_sequence" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo 'CREATOR_COMPONENT_CANDIDATE_GATE=READY'
          else
            echo 'CREATOR_COMPONENT_CANDIDATE_GATE=BLOCKED'
            echo 'CREATOR_COMPONENT_BUNDLE_BUILT=NO'
          fi

  build-windows-candidate:
    needs: trust-and-contract-gate
    if: ${{ needs.trust-and-contract-gate.outputs.ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Test component verifier signer packager and Windows target policy
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tools/creator
          try {
            go test -count=1 ./componentchannel
            go test -count=1 ./host/windows
            python componentchannel/test_package_candidate.py
          } finally {
            Pop-Location
          }
          Push-Location tools/release-signing
          try {
            go test -count=1 ./cmd/ordax-creator-component-signing
          } finally {
            Pop-Location
          }

      - name: Build read-only inspection component
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $PWD 'out/creator-component-candidate'
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          Push-Location tools/creator
          try {
            go build -trimpath -buildvcs=false -ldflags='-s -w' `
              -o ../../out/creator-component-candidate/ordax-creator-physical-test.exe `
              ./cmd/ordax-creator-inspection
          } finally {
            Pop-Location
          }
          $backend = Join-Path $candidate 'ordax-creator-physical-test.exe'
          $statusRaw = & $backend status
          if ($LASTEXITCODE -ne 0) { throw 'inspection backend status failed' }
          $status = $statusRaw | ConvertFrom-Json
          if ($status.'$schema' -ne 'prototype-ordax.creator-physical-test-status/2') { throw 'unexpected inspection status schema' }
          if ($status.raw_backend_linked -ne $false) { throw 'read-only component linked raw backend' }
          if ($status.build.physical_write_authorized -ne $false -or $status.build.ready -ne $false) { throw 'read-only component unexpectedly authorizes physical write' }
          Write-Host 'CREATOR_COMPONENT_RAW_BACKEND_LINKED=NO'
          Write-Host 'CREATOR_COMPONENT_PHYSICAL_WRITE=NO'

      - name: Package exact unsigned signing input deterministically
        shell: pwsh
        env:
          COMPONENT_VERSION: ${{ needs.trust-and-contract-gate.outputs.version }}
          RELEASE_SEQUENCE: ${{ needs.trust-and-contract-gate.outputs.release_sequence }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python tools/creator/componentchannel/package_candidate.py `
            --executable out/creator-component-candidate/ordax-creator-physical-test.exe `
            --output-dir out/creator-component-release `
            --version $env:COMPONENT_VERSION `
            --release-sequence $env:RELEASE_SEQUENCE `
            --source-commit $env:GITHUB_SHA

          $release = Join-Path $PWD 'out/creator-component-release'
          if (Get-ChildItem -LiteralPath $release -Recurse -File | Where-Object { $_.Extension -in @('.pem', '.key', '.p12', '.pfx', '.dpapi') }) {
            throw 'private signing material entered Creator component release input'
          }
          Write-Host 'CREATOR_COMPONENT_RELEASE_PACKAGE_READY_FOR_OFFLINE_SIGNING=YES'
          Write-Host 'CREATOR_COMPONENT_ENVELOPE_PRESENT=NO'
          Write-Host 'PRIVATE_KEY_REQUIRED_IN_CI=NO'

      - name: Upload non-published component signing input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-creator-component-candidate-${{ github.sha }}
          path: |
            out/creator-component-candidate/
            out/creator-component-release/
          if-no-files-found: error
          retention-days: 7

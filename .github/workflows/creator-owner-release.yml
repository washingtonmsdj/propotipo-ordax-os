name: Creator Owner Standalone Release

on:
  push:
    branches: [main]
    paths:
      - 'boot/esp/**'
      - 'bootstrap/kernel/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/network/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/recovery/**'
      - 'bootstrap/config/**'
      - 'bootstrap/entrypoint'
      - 'tools/creator/**'
      - 'tools/release-signing/**'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/physical-media.json'
      - '.github/workflows/creator-owner-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: creator-owner-standalone-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test Creator core and Windows target policy
        run: |
          set -euo pipefail
          (cd tools/creator && go test -count=1 ./...)

      - name: Install bounded bootstrap and media dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2 \
            meson ninja-build gperf libcap-dev libmount-dev libblkid-dev \
            liblz4-dev libzstd-dev liblzma-dev libpcre2-dev \
            gdisk dosfstools e2fsprogs mtools util-linux
          python -m pip install --disable-pip-version-check --no-cache-dir jinja2 pyelftools

      - name: Build real bootstrap owners
        run: |
          set -euo pipefail
          python boot/esp/build.py check
          python boot/esp/build.py build
          python boot/esp/build.py verify
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4
          python bootstrap/kernel/verify.py out/kernel
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          python bootstrap/network/build.py check
          python bootstrap/network/build.py build --jobs 4
          python bootstrap/network/build.py verify
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-acquisition/ordax-release-agent .
          )
          test -s out/release-acquisition/ordax-release-agent

      - name: Create ephemeral prototype trust for this boot image
        run: |
          set -euo pipefail
          mkdir -p out/owner-prototype bootstrap/trust
          (
            cd tools/release-signing
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/owner-prototype/ordax-release-signing .
          )
          signer="$PWD/out/owner-prototype/ordax-release-signing"
          private="$RUNNER_TEMP/owner-prototype-private.pem"
          "$signer" generate-key \
            --private-key "$private" \
            --trust bootstrap/trust/release-ed25519.json \
            --key-id owner-prototype-${GITHUB_SHA::12}
          test -s "$private"
          test -s bootstrap/trust/release-ed25519.json
          echo "$private" > "$RUNNER_TEMP/owner-prototype-private-path"

      - name: Derive byte-complete prototype manifest without changing canonical policy
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/minimal-bootstrap-owner-prototype.json" <<'PY'
          import hashlib, json, pathlib, sys
          source = pathlib.Path('docs/contracts/minimal-bootstrap.json')
          trust = pathlib.Path('bootstrap/trust/release-ed25519.json')
          initramfs = pathlib.Path('out/initramfs/initramfs.cpio.gz')
          output = pathlib.Path(sys.argv[1])
          manifest = json.loads(source.read_text(encoding='utf-8'))
          if not initramfs.is_file() or initramfs.is_symlink():
              raise SystemExit('rebuilt owner-prototype initramfs is missing or unsafe')
          trust_digest = hashlib.sha256(trust.read_bytes()).hexdigest()
          initramfs_digest = hashlib.sha256(initramfs.read_bytes()).hexdigest()
          groups = {group['id']: group for group in manifest['artifact_groups']}
          initramfs_group = groups.get('initramfs')
          if not initramfs_group:
              raise SystemExit('initramfs artifact group is missing from minimal bootstrap manifest')
          initramfs_artifacts = [
              artifact for artifact in initramfs_group.get('artifacts', [])
              if artifact.get('source_path') == 'bootstrap/initramfs/initramfs.cpio.gz'
          ]
          if len(initramfs_artifacts) != 1:
              raise SystemExit('expected exactly one canonical initramfs artifact to rebind')
          initramfs_artifacts[0]['sha256'] = initramfs_digest
          group = groups['bootstrap-release-trust']
          group['resolved'] = True
          group['artifacts'] = [{
              'source_path': 'bootstrap/trust/release-ed25519.json',
              'target_path': '/ordax/bootstrap/trust/release-ed25519.json',
              'sha256': trust_digest,
              'mode': '0644',
              'logical_owner': 'bootstrap-release-trust',
              'reason': 'Ephemeral public trust anchor for the owner-only physical prototype'
          }]
          manifest['status'] = 'owner-prototype-byte-complete-ephemeral-trust'
          manifest['all_artifacts_resolved'] = True
          manifest['physical_write_allowed'] = False
          output.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('OWNER_PROTOTYPE_TRUST_SHA256=' + trust_digest)
          print('OWNER_PROTOTYPE_INITRAMFS_SHA256=' + initramfs_digest)
          PY

      - name: Assemble and stage the complete bootstrap payload
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/minimal-bootstrap-owner-prototype.json"
          payload="$RUNNER_TEMP/owner-prototype-payload"
          stage="$RUNNER_TEMP/owner-prototype-stage"
          python tools/creator/assemble.py build --manifest "$manifest" --out-dir "$payload"
          python tools/creator/assemble.py verify --manifest "$manifest" --payload-root "$payload"
          pushd tools/creator >/dev/null
          go run ./cmd/ordax-creator verify-payload \
            --manifest "$manifest" \
            --payload-root "$payload"
          go run ./cmd/ordax-creator stage-tree \
            --manifest "$manifest" \
            --payload-root "$payload" \
            --output-root "$stage"
          popd >/dev/null
          echo "$stage" > "$RUNNER_TEMP/owner-prototype-stage-path"

      - name: Materialize and verify the exact RAW seed image
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/owner-prototype-stage-path")"
          proof="$RUNNER_TEMP/owner-prototype-media"
          python tools/creator/proof/disposable_media.py \
            --contract docs/contracts/physical-media.json \
            --stage-root "$stage" \
            --output-root "$proof"
          python - "$proof/proof.json" <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['status'] == 'pass'
          assert proof['physical_write_authorized'] is False
          assert all(proof['checks'].values())
          PY
          echo "$proof/ordax-disposable.raw" > "$RUNNER_TEMP/owner-prototype-seed-path"

      - name: Stage embedded payload and build the one-file Windows Creator
        run: |
          set -euo pipefail
          seed="$(cat "$RUNNER_TEMP/owner-prototype-seed-path")"
          manifest="$RUNNER_TEMP/minimal-bootstrap-owner-prototype.json"
          payload='tools/creator/cmd/ordax-creator-app/owner_payload'
          release="$GITHUB_WORKSPACE/out/owner-prototype/release"
          mkdir -p "$payload" "$release"

          trust_sha="$(sha256sum bootstrap/trust/release-ed25519.json | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          seed_sha="$(sha256sum "$seed" | cut -d' ' -f1)"
          seed_size="$(stat -c '%s' "$seed")"

          gzip -9 -n -c "$seed" > "$payload/ordax-bootstrap-seed.raw.gz"
          python - "$payload/provenance.json" "$trust_sha" "$manifest_sha" "$seed_sha" "$seed_size" <<'PY'
          import json, os, pathlib, sys
          data = {
              '$schema': 'prototype-ordax.creator-owner-physical/1',
              'status': 'owner-prototype-write-enabled',
              'source_commit': os.environ['GITHUB_SHA'],
              'canonical_public_release': False,
              'ephemeral_prototype_trust': True,
              'private_key_in_package': False,
              'raw_backend_linked': True,
              'physical_write_authorized_in_binary': True,
              'system_disk_exclusion_required': True,
              'live_target_revalidation_required': True,
              'windows_uac_required': True,
              'readback_verification_required': True,
              'trust_sha256': sys.argv[2],
              'prototype_manifest_sha256': sys.argv[3],
              'seed_sha256': sys.argv[4],
              'seed_size': int(sys.argv[5]),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          python - "$payload/ordax-bootstrap-seed.raw.gz" "$payload/provenance.json" <<'PY'
          import gzip, hashlib, json, pathlib, sys
          compressed = pathlib.Path(sys.argv[1])
          provenance = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          digest = hashlib.sha256()
          size = 0
          with gzip.open(compressed, 'rb') as source:
              while True:
                  chunk = source.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  size += len(chunk)
          if size != int(provenance['seed_size']):
              raise SystemExit('embedded seed size mismatch')
          if digest.hexdigest() != provenance['seed_sha256']:
              raise SystemExit('embedded seed SHA-256 mismatch')
          PY

          pushd tools/creator >/dev/null
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
              -tags 'ordax_owner_prototype,ordax_single_exe,ordax_raw_backend' \
              -ldflags='-s -w -H=windowsgui' \
              -o "$release/OrdaX-Creator.exe" \
              ./cmd/ordax-creator-app
          popd >/dev/null

          test -s "$release/OrdaX-Creator.exe"
          strings "$release/OrdaX-Creator.exe" | grep -F "$GITHUB_SHA" >/dev/null
          test "$(find "$release" -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          if find "$release" -maxdepth 1 -type f -name '*.zip' -print -quit | grep -q .; then
            echo 'standalone release must not contain a ZIP' >&2
            exit 1
          fi

          cat > "$release/LEIA-ME.txt" <<'TXT'
          OrdaX Creator - Owner Prototype Standalone

          USO:
          1. Baixe somente OrdaX-Creator.exe.
          2. Conecte o pendrive que sera apagado.
          3. Abra OrdaX-Creator.exe.
          4. Escolha o USB e clique em Criar OrdaX.
          5. Confirme uma unica elevacao UAC para a gravacao.
          6. Nao remova o USB ate a verificacao terminar.

          Nao e necessario extrair ZIP, instalar backend, copiar seed ou manter arquivos auxiliares ao lado do aplicativo.
          O backend interno usa a mesma build do EXE visivel e o seed autorizado e incorporado ao aplicativo.
          Este ainda e o canal Owner Prototype; Authenticode publico definitivo continua separado desta etapa.
          TXT

          sha256sum "$release/OrdaX-Creator.exe" > "$release/SHA256SUMS.txt"
          exe_sha="$(cut -d' ' -f1 "$release/SHA256SUMS.txt")"
          exe_size="$(stat -c '%s' "$release/OrdaX-Creator.exe")"
          version="owner-${GITHUB_SHA:0:12}"
          python - "$release/creator-owner-update.json" "$GITHUB_SHA" "$version" "$exe_sha" "$exe_size" <<'PY'
          import json, pathlib, sys
          output, source, version, digest, size = sys.argv[1:]
          data = {
              '$schema': 'prototype-ordax.creator-owner-update/2',
              'channel': 'owner-prototype',
              'version': version,
              'source_commit': source,
              'download_url': 'https://github.com/washingtonmsdj/prototipo-ordax-os/releases/download/creator-owner-prototype/OrdaX-Creator.exe',
              'sha256': digest,
              'size': int(size),
          }
          pathlib.Path(output).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          rm -rf "$payload"
          if find "$release" -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.dpapi' \) -print -quit | grep -q .; then
            echo 'private signing material entered standalone release' >&2
            exit 1
          fi
          echo "OWNER_STANDALONE_SOURCE=$GITHUB_SHA"
          echo "OWNER_STANDALONE_EXE_SHA256=$exe_sha"
          echo "OWNER_STANDALONE_SEED_SHA256=$seed_sha"

      - name: Destroy ephemeral private key before publish
        run: |
          set -euo pipefail
          private="$(cat "$RUNNER_TEMP/owner-prototype-private-path")"
          rm -f "$private"
          test ! -e "$private"
          rm -f out/owner-prototype/ordax-release-signing
          echo 'EPHEMERAL_PRIVATE_KEY_DESTROYED=YES'

      - name: Publish standalone EXE and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='washingtonmsdj/prototipo-ordax-os'
          release="$GITHUB_WORKSPACE/out/owner-prototype/release"
          if ! gh release view creator-owner-prototype --repo "$repo" >/dev/null 2>&1; then
            gh release create creator-owner-prototype \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title 'OrdaX Creator - Owner Prototype (standalone EXE)' \
              --prerelease \
              --notes 'Owner-only physical prototype. Download only OrdaX-Creator.exe. No ZIP extraction or side-by-side backend/seed is required.'
          fi
          gh release upload creator-owner-prototype \
            "$release/OrdaX-Creator.exe" \
            "$release/SHA256SUMS.txt" \
            "$release/LEIA-ME.txt" \
            "$release/creator-owner-update.json" \
            --repo "$repo" \
            --clobber
          gh release delete-asset creator-owner-prototype \
            'OrdaX-Creator-Owner-Prototype.zip' \
            --repo "$repo" \
            --yes || true
          gh release edit creator-owner-prototype \
            --repo "$repo" \
            --target "$GITHUB_SHA" \
            --title 'OrdaX Creator - Owner Prototype (standalone EXE)' \
            --notes 'Owner-only physical prototype. Download only OrdaX-Creator.exe. No ZIP extraction or side-by-side backend/seed is required. The application keeps system-disk exclusion, live target revalidation, one UAC elevation, readback verification and transactional in-app updates.'
          echo 'OWNER_RELEASE_PIPELINE=UNIFIED'
          echo 'OWNER_STANDALONE_EXE_PUBLISHED=YES'
          echo "OWNER_STANDALONE_SOURCE=$GITHUB_SHA"

      - name: Cleanup ephemeral private material
        if: ${{ always() }}
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/owner-prototype-private-path" ]; then
            private="$(cat "$RUNNER_TEMP/owner-prototype-private-path")"
            rm -f "$private"
          fi
          rm -rf tools/creator/cmd/ordax-creator-app/owner_payload
          rm -f out/owner-prototype/ordax-release-signing

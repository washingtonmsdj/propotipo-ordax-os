permissions:
  contents: read

jobs:
  web-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Validate shared Surface source graph
        run: python tools/surface-web/build.py check

      - name: Validate zero-dependency ES modules and shared state services
        run: |
          set -euo pipefail
          node --version
          find \
            system/contracts \
            system/services/account \
            system/services/apps \
            system/services/components \
            system/services/files \
            system/services/projects \
            system/services/internet \
            system/services/notes \
            system/services/preferences \
            system/services/sync \
            system/services/diagnostics \
            system/services/update \
            system/services/notifications \
            system/apps \
            system/components \
            system/surface/ui \
            system/adapters/web \
            system/adapters/native \
            system/composition/web \
            system/composition/native \
            -type f -name '*.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          node --test tests/test_surface_preferences.mjs
          node --test tests/test_surface_workspace.mjs
          node --test tests/test_recent_files.mjs
          node --test tests/test_projects.mjs
          node --test tests/test_project_web_references.mjs
          node --test tests/test_browser_favorites.mjs
          node --test tests/test_browser_history.mjs
          node --test tests/test_project_file_space_continuity.mjs
          node --test tests/test_home_continuation.mjs
          node --test tests/test_notifications.mjs
          node --test tests/test_notes_runtime.mjs
          node --test tests/test_notes_image_previews.mjs
          node --test tests/test_notes_list_model.mjs
          node --test tests/test_notes_file_picker.mjs
          node --test tests/test_notes_editor_save.mjs
          node --test tests/test_notes_reference_links.mjs
          node --test tests/test_files_to_notes_import.mjs
          node --test tests/test_file_notes_action.mjs
          node --test tests/test_app_activation.mjs
          node --test tests/test_app_contract.mjs
          node --test tests/test_component_manager.mjs
          node --test tests/test_component_runtime.mjs
          node --test tests/test_identity_session.mjs
          node --test tests/test_identity_actions.mjs
          node --test tests/test_power_actions.mjs
          node --test tests/test_power_status.mjs
          node --test tests/test_update_*.mjs
          node --test tests/test_account_runtime.mjs
          node --test tests/test_network_status.mjs
          node --test tests/test_network_management.mjs
          node --test tests/test_network_management_runtime.mjs
          node --test tests/test_client_diagnostics.mjs
          node --test tests/test_diagnostic_*.mjs
          node --test tests/test_sync_*.mjs

      - name: Run Surface and Web bundle regressions
        run: |
          python -m unittest tests.test_surface_ui_contract -v
          python -m unittest tests.test_surface_web_builder -v
          python -m unittest tests.test_recent_files_ui_contract -v
          python -m unittest tests.test_project_files_ui_contract -v
          python -m unittest tests.test_home_continuation_contract -v
          python -m unittest tests.test_notification_center_ui_contract -v
          python -m unittest tests.test_files_to_notes_import_contract -v
          python -m unittest tests.test_file_notes_action_contract -v
          python -m unittest tests.test_notes_native -v
          python -m unittest tests.test_native_component_state -v
          python -m unittest tests.test_browser_session_integration_contract -v
          python -m unittest tests.test_browser_session_store -v
          python -m unittest tests.test_internet_accessibility_contract -v
          python -m unittest tests.test_internet_browser_contract -v
          python -m unittest tests.test_internet_project_context_contract -v
          python -m unittest tests.test_internet_favorites_contract -v
          python -m unittest tests.test_internet_history_contract -v
          python -m unittest tests.test_native_host_module_integrity -v
          python -m unittest tests.test_native_request_boundary -v
          python -m unittest tests.test_system_runtime_contract -v
          python -m unittest tests.test_third_party_inventory -v

      - name: Build and verify deterministic Web client
        run: |
          set -euo pipefail
          python tools/surface-web/build.py build \
            --source-commit "$GITHUB_SHA" \
            --out-dir out/web-client
          python tools/surface-web/build.py verify --out-dir out/web-client
          python tools/surface-web/build.py build \
            --source-commit "$GITHUB_SHA" \
            --out-dir "$RUNNER_TEMP/web-client-repeat"
          python tools/surface-web/build.py verify --out-dir "$RUNNER_TEMP/web-client-repeat"
          diff -qr out/web-client "$RUNNER_TEMP/web-client-repeat"
          echo 'WEB_CLIENT_REPEATABILITY=PASS'
          echo 'KERNEL_REBUILD_REQUIRED=NO'

      - name: Run real Chromium Surface smoke
        run: |
          set -euo pipefail
          node tools/surface-web/browser-smoke.mjs --bundle-dir out/web-client

      - name: Upload Web client candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-web-client-${{ github.sha }}
          path: out/web-client/
          if-no-files-found: error
          retention-days: 14

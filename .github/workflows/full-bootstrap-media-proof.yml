name: Full Bootstrap Media Proof

on:
  push:
    branches: [main]
    paths:
      - 'boot/esp/**'
      - 'bootstrap/kernel/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/network/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/recovery/**'
      - 'bootstrap/config/**'
      - 'bootstrap/entrypoint'
      - 'tools/creator/core/**'
      - 'tools/creator/cmd/ordax-creator/**'
      - 'tools/creator/assemble.py'
      - 'tools/creator/proof/**'
      - 'tools/creator/go.mod'
      - 'tools/creator/go.sum'
      - 'tools/release-signing/**'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/physical-media.json'
      - '.github/workflows/full-bootstrap-media-proof.yml'
  pull_request:
    paths:
      - 'boot/esp/**'
      - 'bootstrap/kernel/**'
      - 'bootstrap/initramfs/**'
      - 'bootstrap/network/**'
      - 'bootstrap/release-acquisition/**'
      - 'bootstrap/recovery/**'
      - 'bootstrap/config/**'
      - 'bootstrap/entrypoint'
      - 'tools/creator/core/**'
      - 'tools/creator/cmd/ordax-creator/**'
      - 'tools/creator/assemble.py'
      - 'tools/creator/proof/**'
      - 'tools/creator/go.mod'
      - 'tools/creator/go.sum'
      - 'tools/release-signing/**'
      - 'docs/contracts/minimal-bootstrap.json'
      - 'docs/contracts/physical-media.json'
      - '.github/workflows/full-bootstrap-media-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-bootstrap-media-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-bootstrap-media-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install bounded build and media-proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc gcc-13 make bc perl bison flex openssl libssl-dev libelf-dev \
            dwarves kmod xz-utils pkg-config musl-tools binutils bzip2 \
            meson ninja-build gperf libcap-dev libmount-dev libblkid-dev \
            liblz4-dev libzstd-dev liblzma-dev libpcre2-dev \
            gdisk dosfstools e2fsprogs mtools util-linux
          python -m pip install --disable-pip-version-check --no-cache-dir \
            jinja2 pyelftools

      - name: Build real bootstrap owners
        run: |
          set -euo pipefail
          python boot/esp/build.py check
          python boot/esp/build.py build
          python boot/esp/build.py verify
          python bootstrap/kernel/build.py check
          python bootstrap/kernel/build.py build --jobs 4
          python bootstrap/kernel/verify.py out/kernel
          python bootstrap/initramfs/build.py check
          python bootstrap/initramfs/build.py build --jobs 4
          python bootstrap/initramfs/build.py verify
          python bootstrap/network/build.py check
          python bootstrap/network/build.py build --jobs 4
          python bootstrap/network/build.py verify
          (
            cd bootstrap/release-acquisition
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/release-acquisition/ordax-release-agent .
          )
          test -s out/release-acquisition/ordax-release-agent

      - name: Prove initramfs ext4 online growth on disposable twin media
        run: |
          set -euo pipefail
          mkdir -p out/full-media-proof
          bash bootstrap/initramfs/prove_ext4_growth.sh \
            out/initramfs-work/ordax-grow-ext4 \
            out/full-media-proof/ext4-growth-runtime-proof.json
          python - out/full-media-proof/ext4-growth-runtime-proof.json <<'PY'
          import json, pathlib, sys
          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert proof['$schema'] == 'prototype-ordax.ext4-growth-runtime-proof/2'
          assert proof['status'] == 'pass'
          assert proof['source_commit'] == __import__('os').environ['GITHUB_SHA']
          assert proof['checks']['static_helper'] is True
          assert proof['checks']['mismatched_device_rejected'] is True
          assert proof['checks']['canonical_superblock_count_used'] is True
          assert proof['checks']['rw_online_growth_matches_resize2fs_maximum'] is True
          assert proof['checks']['unused_tail_less_than_one_block_group'] is True
          assert proof['checks']['read_only_mount_rejected'] is True
          assert proof['checks']['read_only_size_unchanged'] is True
          assert proof['fixture']['ordax_final_blocks'] == proof['fixture']['resize2fs_final_blocks']
          assert proof['fixture']['unused_tail_blocks'] < proof['fixture']['blocks_per_group']
          assert proof['physical_write_authorized'] is False
          assert proof['physical_hardware_proven'] is False
          print('EXT4_RUNTIME_GROWTH_PROOF=PASS')
          PY

      - name: Build signer and create ephemeral proof trust
        run: |
          set -euo pipefail
          mkdir -p out/full-media-proof bootstrap/trust
          (
            cd tools/release-signing
            go test -count=1 ./...
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -buildvcs=false -ldflags='-s -w' \
              -o ../../out/full-media-proof/ordax-release-signing .
          )
          signer="$PWD/out/full-media-proof/ordax-release-signing"
          private="$RUNNER_TEMP/full-media-proof-private.pem"
          "$signer" generate-key \
            --private-key "$private" \
            --trust bootstrap/trust/release-ed25519.json \
            --key-id ci-full-media-proof
          test -s "$private"
          test -s bootstrap/trust/release-ed25519.json

      - name: Derive fully resolved proof manifest without mutating canonical contract
        run: |
          python - "$RUNNER_TEMP/minimal-bootstrap-full-proof.json" <<'PY'
          import hashlib, json, pathlib, sys
          source = pathlib.Path('docs/contracts/minimal-bootstrap.json')
          trust = pathlib.Path('bootstrap/trust/release-ed25519.json')
          output = pathlib.Path(sys.argv[1])
          manifest = json.loads(source.read_text(encoding='utf-8'))
          payload = trust.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          groups = {group['id']: group for group in manifest['artifact_groups']}
          group = groups['bootstrap-release-trust']
          assert group['resolved'] is False and group['artifacts'] == []
          group['resolved'] = True
          group['artifacts'] = [{
              'source_path': 'bootstrap/trust/release-ed25519.json',
              'target_path': '/ordax/bootstrap/trust/release-ed25519.json',
              'sha256': digest,
              'mode': '0644',
              'logical_owner': 'bootstrap-release-trust',
              'reason': 'Ephemeral CI-only public trust anchor used solely to prove byte-complete media composition'
          }]
          manifest['status'] = 'ci-proof-byte-complete-ephemeral-trust'
          manifest['all_artifacts_resolved'] = True
          manifest['physical_write_allowed'] = False
          output.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('EPHEMERAL_TRUST_SHA256=' + digest)
          PY

      - name: Assemble and verify byte-complete payload
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/minimal-bootstrap-full-proof.json"
          payload="$RUNNER_TEMP/full-media-payload"
          python tools/creator/assemble.py build --manifest "$manifest" --out-dir "$payload"
          python tools/creator/assemble.py verify --manifest "$manifest" --payload-root "$payload"
          python - "$payload/payload-provenance.json" <<'PY'
          import json, pathlib, sys
          p = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert p['status'] == 'complete-candidate'
          assert p['unresolved_groups'] == []
          assert p['physical_write_authorized'] is False
          print('BYTE_COMPLETE_PAYLOAD=PASS')
          PY

      - name: Stage payload through Creator Core
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/minimal-bootstrap-full-proof.json"
          payload="$RUNNER_TEMP/full-media-payload"
          stage="$RUNNER_TEMP/full-media-stage"
          pushd tools/creator >/dev/null
          verify_output="$(go run ./cmd/ordax-creator verify-payload --manifest "$manifest" --payload-root "$payload")"
          printf '%s\n' "$verify_output"
          stage_output="$(go run ./cmd/ordax-creator stage-tree --manifest "$manifest" --payload-root "$payload" --output-root "$stage")"
          printf '%s\n' "$stage_output"
          grep -q '^DISPOSABLE_TREE_STAGED=YES$' <<<"$stage_output"
          grep -q '^PHYSICAL_WRITE_STATUS=blocked$' <<<"$stage_output"
          popd >/dev/null
          printf '%s\n' "$stage" > "$RUNNER_TEMP/full-media-stage-path"

      - name: Prove real GPT, FAT32, ext4 and post-materialization hashes
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/full-media-stage-path")"
          output="$RUNNER_TEMP/full-media-disk-proof"
          python tools/creator/proof/disposable_media.py \
            --contract docs/contracts/physical-media.json \
            --stage-root "$stage" \
            --output-root "$output"
          python - \
            "$output/proof.json" \
            "$RUNNER_TEMP/full-media-payload/payload-provenance.json" \
            "out/full-media-proof/ext4-growth-runtime-proof.json" <<'PY'
          import json, pathlib, sys
          disk_proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          payload = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          ext4 = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding='utf-8'))
          assert disk_proof['status'] == 'pass'
          assert disk_proof['physical_write_authorized'] is False
          assert all(disk_proof['checks'].values())
          assert ext4['$schema'] == 'prototype-ordax.ext4-growth-runtime-proof/2'
          assert ext4['status'] == 'pass'
          assert all(ext4['checks'].values())
          assert ext4['physical_write_authorized'] is False
          assert ext4['physical_hardware_proven'] is False
          assert ext4['fixture']['ordax_final_blocks'] == ext4['fixture']['resize2fs_final_blocks']
          summary = {
              '$schema': 'prototype-ordax.full-bootstrap-media-proof/2',
              'status': 'pass',
              'canonical_trust': False,
              'ephemeral_ci_trust': True,
              'payload_artifact_count': payload['artifact_count'],
              'unresolved_groups': payload['unresolved_groups'],
              'disk_image_sha256': disk_proof['image_sha256'],
              'ext4_growth_runtime_proven': True,
              'ext4_growth_matches_resize2fs': True,
              'ext4_growth_helper_sha256': ext4['helper_sha256'],
              'ext4_growth_initial_blocks': ext4['fixture']['initial_blocks'],
              'ext4_growth_raw_target_blocks': ext4['fixture']['raw_target_blocks'],
              'ext4_growth_final_blocks': ext4['fixture']['ordax_final_blocks'],
              'ext4_growth_unused_tail_blocks': ext4['fixture']['unused_tail_blocks'],
              'physical_hardware_proven': False,
              'physical_write_authorized': False,
          }
          pathlib.Path('out/full-media-proof/proof-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('REAL_BOOTSTRAP_MEDIA_COMPOSITION=PASS')
          print('EXT4_RUNTIME_GROWTH_INTEGRATED=PASS')
          print('CANONICAL_TRUST=NO')
          print('PHYSICAL_HARDWARE_PROVEN=NO')
          print('PHYSICAL_WRITE_AUTHORIZED=NO')
          PY

      - name: Destroy ephemeral private key and unpublished media bytes
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/full-media-proof-private.pem"
          rm -f bootstrap/trust/release-ed25519.json
          rm -rf "$RUNNER_TEMP/full-media-payload" "$RUNNER_TEMP/full-media-stage"
          rm -f "$RUNNER_TEMP/full-media-disk-proof/ordax-disposable.raw"
          rm -f out/full-media-proof/ordax-release-signing
          test ! -e "$RUNNER_TEMP/full-media-proof-private.pem"
          test ! -e bootstrap/trust/release-ed25519.json
          test ! -e "$RUNNER_TEMP/full-media-disk-proof/ordax-disposable.raw"
          test -z "$(git status --porcelain)"
          echo 'EPHEMERAL_PRIVATE_KEY_DESTROYED=YES'
          echo 'RAW_IMAGE_PUBLISHED=NO'

      - name: Upload proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-full-bootstrap-media-proof-${{ github.sha }}
          path: |
            out/full-media-proof/proof-summary.json
            out/full-media-proof/ext4-growth-runtime-proof.json
            ${{ runner.temp }}/full-media-disk-proof/proof.json
          if-no-files-found: error
          retention-days: 14

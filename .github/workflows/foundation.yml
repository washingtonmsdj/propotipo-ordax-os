name: Foundation Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON contracts
        run: python -m json.tool docs/contracts/foundation.json >/dev/null

      - name: Run foundation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

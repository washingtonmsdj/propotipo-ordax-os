name: Foundation Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate JSON contracts
        run: |
          python -m json.tool docs/contracts/foundation.json >/dev/null
          python -m json.tool docs/contracts/product-capabilities.json >/dev/null
          python -m json.tool docs/contracts/release-protocol.json >/dev/null
          python -m json.tool docs/contracts/minimal-bootstrap.json >/dev/null
          python -m json.tool docs/contracts/build-autonomy.json >/dev/null
          python -m json.tool docs/contracts/release-channel.json >/dev/null
          python -m json.tool docs/contracts/physical-media.json >/dev/null
          python -m json.tool bootstrap/kernel/source.json >/dev/null
          python -m json.tool bootstrap/initramfs/source.json >/dev/null
          python -m json.tool bootstrap/network/source.json >/dev/null
          python -m json.tool boot/esp/source.json >/dev/null

      - name: Validate build contracts without compiling
        run: |
          python bootstrap/kernel/build.py check
          python bootstrap/initramfs/build.py check
          python bootstrap/network/build.py check
          python boot/esp/build.py check

      - name: Run foundation regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v

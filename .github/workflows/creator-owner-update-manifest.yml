name: Creator Owner Update Manifest

on:
  workflow_run:
    workflows: ['Creator Owner Standalone EXE']
    types: [completed]

permissions:
  contents: write

jobs:
  publish-update-manifest:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download published standalone Creator and derive immutable update binding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repo='washingtonmsdj/prototipo-ordax-os'
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          gh release download creator-owner-prototype \
            --repo "$repo" \
            --pattern 'OrdaX-Creator.exe' \
            --dir "$release" \
            --clobber

          package="$release/OrdaX-Creator.exe"
          test -s "$package"
          digest="$(sha256sum "$package" | cut -d' ' -f1)"
          size="$(stat -c '%s' "$package")"
          version="owner-${SOURCE_COMMIT:0:12}"

          python - "$release/creator-owner-update.json" "$SOURCE_COMMIT" "$version" "$digest" "$size" <<'PY'
          import json, pathlib, sys
          output, source, version, digest, size = sys.argv[1:]
          data = {
              '$schema': 'prototype-ordax.creator-owner-update/2',
              'channel': 'owner-prototype',
              'version': version,
              'source_commit': source,
              'download_url': 'https://github.com/washingtonmsdj/prototipo-ordax-os/releases/download/creator-owner-prototype/OrdaX-Creator.exe',
              'sha256': digest,
              'size': int(size),
          }
          pathlib.Path(output).write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

          gh release edit creator-owner-prototype \
            --repo "$repo" \
            --target "$SOURCE_COMMIT"
          gh release upload creator-owner-prototype \
            "$release/creator-owner-update.json" \
            --repo "$repo" \
            --clobber

          echo "OWNER_UPDATE_MANIFEST_SOURCE=$SOURCE_COMMIT"
          echo "OWNER_UPDATE_MANIFEST_SHA256=$digest"
          echo 'OWNER_UPDATE_ARTIFACT=OrdaX-Creator.exe'

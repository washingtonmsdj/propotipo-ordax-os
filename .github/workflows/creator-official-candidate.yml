name: Creator Official Candidate

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/trust/release-ed25519.json'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/creator-app-channel.json'
      - 'docs/contracts/creator-component-channel.json'
      - 'docs/contracts/creator-code-signing.json'
      - 'tools/creator/**'
      - 'tools/release-signing/cmd/ordax-creator-app-signing/**'
      - '.github/workflows/creator-official-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      trust_sha256: ${{ steps.gate.outputs.trust_sha256 }}
      trust_base64: ${{ steps.gate.outputs.trust_base64 }}
      app_version: ${{ steps.gate.outputs.app_version }}
      app_sequence: ${{ steps.gate.outputs.app_sequence }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require canonical public trust and exact official contracts
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          trust_sha=''
          trust_b64=''
          app_version=''
          app_sequence=''
          if [ -f bootstrap/trust/release-ed25519.json ]; then
            readarray -t app_values < <(python - <<'PY'
          import base64, json, pathlib, re
          trust = json.loads(pathlib.Path('bootstrap/trust/release-ed25519.json').read_text(encoding='utf-8'))
          policy = json.loads(pathlib.Path('docs/contracts/release-trust-policy.json').read_text(encoding='utf-8'))
          app = json.loads(pathlib.Path('docs/contracts/creator-app-channel.json').read_text(encoding='utf-8'))
          component = json.loads(pathlib.Path('docs/contracts/creator-component-channel.json').read_text(encoding='utf-8'))
          code_signing = json.loads(pathlib.Path('docs/contracts/creator-code-signing.json').read_text(encoding='utf-8'))

          assert trust['$schema'] == 'prototype-ordax.release-trust/1'
          assert trust['key_id'] == policy['canonical_key_id'] == 'ordax-prototype-release-v1'
          assert len(base64.b64decode(trust['public_key_base64'], validate=True)) == 32
          assert policy['consumer_creator']['generates_publisher_private_keys'] is False
          assert policy['consumer_creator']['stores_publisher_private_keys'] is False
          assert policy['consumer_creator']['requests_private_key_backup_from_end_user'] is False
          assert policy['private_key']['end_user_must_never_receive_or_manage_private_key'] is True
          assert policy['gates']['key_material_generated'] is True
          assert policy['gates']['public_anchor_pinned'] is True

          assert app['$schema'] == 'prototype-ordax.creator-app-channel/1'
          assert app['purpose'] == 'creator-app-windows-amd64'
          assert app['release_tag'] == 'creator-app'
          assert app['artifact_name'] == 'OrdaX-Creator-App.exe'
          assert app['envelope_name'] == 'creator-app-envelope.json'
          assert app['launcher_artifact'] == 'OrdaX-Creator.exe'
          assert app['launcher_role'] == 'stable-signed-app-loader'
          assert app['ed25519_signature_required'] is True
          assert app['authenticode_required_before_manifest_generation'] is True
          assert app['development_fallback_allowed_in_official_launcher'] is False
          assert app['in_place_running_executable_replacement_allowed'] is False
          assert app['versioned_install_required'] is True
          assert app['offline_last_known_good_allowed'] is True
          assert app['release_sequence_must_never_decrease'] is True
          assert app['same_sequence_different_commit_allowed'] is False
          assert app['publisher_private_key_in_launcher'] is False
          assert app['publisher_private_key_in_app'] is False
          assert app['publisher_private_key_in_ci_artifact'] is False
          assert app['unsigned_manifest_may_activate_app'] is False
          assert app['publish_allowed'] is False
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', app['version'])
          assert isinstance(app['release_sequence'], int) and not isinstance(app['release_sequence'], bool) and app['release_sequence'] > 0

          assert component['$schema'] == 'prototype-ordax.creator-component-channel/1'
          assert component['purpose'] == 'creator-inspection-windows-amd64'
          assert component['ed25519_signature_required'] is True
          assert component['development_fallback_allowed_in_official_creator'] is False
          assert component['raw_disk_writer_allowed'] is False
          assert component['publisher_private_key_in_consumer'] is False
          assert component['publisher_private_key_in_ci_artifact'] is False
          assert component['unsigned_manifest_may_activate_official_component'] is False

          assert code_signing['$schema'] == 'prototype-ordax.creator-code-signing/2'
          assert code_signing['platform'] == 'windows'
          assert sorted(code_signing['artifacts']) == ['OrdaX-Creator-App.exe', 'OrdaX-Creator.exe']
          assert code_signing['artifact_roles']['OrdaX-Creator.exe'] == 'stable-signed-app-loader'
          assert code_signing['artifact_roles']['OrdaX-Creator-App.exe'] == 'versioned-signed-creator-gui'
          assert code_signing['signature_format'] == 'authenticode'
          assert code_signing['file_digest_algorithm'] == 'sha256'
          assert code_signing['verification']['exact_artifact_name_required'] is True
          assert code_signing['timestamp']['required'] is True
          assert code_signing['timestamp']['protocol'] == 'rfc3161'
          assert code_signing['timestamp']['digest_algorithm'] == 'sha256'
          assert code_signing['custody']['private_key_may_enter_git'] is False
          assert code_signing['custody']['private_key_may_enter_creator'] is False
          assert code_signing['custody']['private_key_may_enter_github_artifact'] is False
          assert code_signing['custody']['pfx_may_enter_git'] is False
          assert code_signing['custody']['pfx_may_enter_github_artifact'] is False
          assert code_signing['custody']['end_user_manages_code_signing_key'] is False
          assert code_signing['release_policy']['unlisted_artifact_publishable'] is False
          assert code_signing['release_policy']['authenticode_is_release_authenticity_root'] is False
          assert code_signing['release_policy']['ed25519_release_verification_remains_required'] is True
          print(app['version'])
          print(app['release_sequence'])
          PY
            )
            app_version="${app_values[0]}"
            app_sequence="${app_values[1]}"
            ready=true
            trust_sha="$(sha256sum bootstrap/trust/release-ed25519.json | cut -d' ' -f1)"
            trust_b64="$(base64 -w0 bootstrap/trust/release-ed25519.json)"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "trust_sha256=$trust_sha" >> "$GITHUB_OUTPUT"
          echo "trust_base64=$trust_b64" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_sequence=$app_sequence" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo 'CREATOR_OFFICIAL_TRUST_GATE=READY'
          else
            echo 'CREATOR_OFFICIAL_TRUST_GATE=BLOCKED'
            echo 'CREATOR_OFFICIAL_BINARY_BUILT=NO'
          fi

  build-windows-candidate:
    needs: trust-gate
    if: ${{ needs.trust-gate.outputs.ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test Creator update chain before official build
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tools/creator
          try {
            go test -count=1 ./...
            go test -count=1 ./host/windows
          } finally {
            Pop-Location
          }
          Push-Location tools/release-signing
          try {
            go test -count=1 ./cmd/ordax-creator-app-signing
          } finally {
            Pop-Location
          }

      - name: Build stable launcher versioned app and offline signing tool
        shell: pwsh
        env:
          TRUST_SHA256: ${{ needs.trust-gate.outputs.trust_sha256 }}
          TRUST_BASE64: ${{ needs.trust-gate.outputs.trust_base64 }}
          APP_VERSION: ${{ needs.trust-gate.outputs.app_version }}
          APP_SEQUENCE: ${{ needs.trust-gate.outputs.app_sequence }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:TRUST_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'canonical trust SHA missing or invalid' }
          if ([string]::IsNullOrWhiteSpace($env:TRUST_BASE64)) { throw 'canonical public trust bytes missing' }
          if ([string]::IsNullOrWhiteSpace($env:APP_VERSION)) { throw 'Creator app version is missing' }
          if ([int64]$env:APP_SEQUENCE -le 0) { throw 'Creator app release sequence is invalid' }

          $out = Join-Path $PWD 'out/creator-official-candidate'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Push-Location tools/creator
          try {
            $launcherLd = "-s -w -H=windowsgui -X main.buildCanonicalTrustBase64=$env:TRUST_BASE64 -X main.buildCanonicalTrustSHA256=$env:TRUST_SHA256"
            go build -trimpath -buildvcs=false -ldflags=$launcherLd `
              -o ../../out/creator-official-candidate/OrdaX-Creator.exe `
              ./cmd/ordax-creator-launcher

            $appLd = "-s -w -H=windowsgui -X main.buildPhysicalTrustBase64=$env:TRUST_BASE64 -X main.buildPhysicalTrustSHA256=$env:TRUST_SHA256"
            go build -trimpath -buildvcs=false -ldflags=$appLd `
              -o ../../out/creator-official-candidate/OrdaX-Creator-App.exe `
              ./cmd/ordax-creator-app
          } finally {
            Pop-Location
          }
          Push-Location tools/release-signing
          try {
            go build -trimpath -buildvcs=false -ldflags='-s -w' `
              -o ../../out/creator-official-candidate/ordax-creator-app-signing.exe `
              ./cmd/ordax-creator-app-signing
          } finally {
            Pop-Location
          }

          foreach ($name in @('OrdaX-Creator.exe', 'OrdaX-Creator-App.exe')) {
            $exe = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "$name missing from official Creator handoff" }
            $signature = Get-AuthenticodeSignature -LiteralPath $exe
            if ([string]$signature.Status -eq 'Valid' -or $null -ne $signature.SignerCertificate) {
              throw "$name unexpectedly contains an Authenticode signer before publisher handoff"
            }
          }

          $codeSigningContract = Join-Path $PWD 'docs/contracts/creator-code-signing.json'
          $appContract = Join-Path $PWD 'docs/contracts/creator-app-channel.json'
          $componentContract = Join-Path $PWD 'docs/contracts/creator-component-channel.json'
          Copy-Item -LiteralPath $codeSigningContract -Destination (Join-Path $out 'creator-code-signing.json')
          Copy-Item -LiteralPath $appContract -Destination (Join-Path $out 'creator-app-channel.json')
          Copy-Item -LiteralPath $componentContract -Destination (Join-Path $out 'creator-component-channel.json')
          Copy-Item -LiteralPath tools/creator/windows/Verify-OrdaXCreatorSignature.ps1 -Destination (Join-Path $out 'Verify-OrdaXCreatorSignature.ps1')

          $launcherSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out 'OrdaX-Creator.exe')).Hash.ToLowerInvariant()
          $appSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out 'OrdaX-Creator-App.exe')).Hash.ToLowerInvariant()
          $signerSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out 'ordax-creator-app-signing.exe')).Hash.ToLowerInvariant()
          @(
            "$launcherSha  OrdaX-Creator.exe"
            "$appSha  OrdaX-Creator-App.exe"
            "$signerSha  ordax-creator-app-signing.exe"
          ) | Set-Content -Encoding ascii (Join-Path $out 'PRE-SIGNING-SHA256SUMS')

          $provenance = [ordered]@{
            '$schema' = 'prototype-ordax.creator-official-candidate/2'
            source_commit = '${{ github.sha }}'
            app_version = $env:APP_VERSION
            app_release_sequence = [int64]$env:APP_SEQUENCE
            canonical_trust_sha256 = $env:TRUST_SHA256
            launcher = [ordered]@{
              name = 'OrdaX-Creator.exe'
              role = 'stable-signed-app-loader'
              pre_signing_sha256 = $launcherSha
            }
            app = [ordered]@{
              name = 'OrdaX-Creator-App.exe'
              role = 'versioned-signed-creator-gui'
              pre_signing_sha256 = $appSha
              manifest_generated = $false
              ed25519_envelope_generated = $false
            }
            creator_component_channel = 'signed-ed25519-only'
            development_component_channel_allowed = $false
            private_key_embedded = $false
            publisher_key_generation_available = $false
            authenticode_signed = $false
            app_manifest_may_be_generated_before_authenticode_verification = $false
            publishable_to_end_users = $false
            required_order = @('authenticode-sign-launcher-and-app', 'verify-authenticode-launcher-and-app', 'generate-app-manifest-from-signed-app-bytes', 'sign-app-manifest-ed25519', 'publish-public-assets')
            remaining_release_gate = 'real Authenticode publisher identity and timestamp, post-sign verification, Ed25519 app envelope, and explicit official publication'
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $out 'provenance.json'), (($provenance | ConvertTo-Json -Depth 10) + "`n"), $utf8)
          Write-Host 'CREATOR_OFFICIAL_LAUNCHER_BUILT=YES'
          Write-Host 'CREATOR_OFFICIAL_VERSIONED_APP_BUILT=YES'
          Write-Host 'CREATOR_OFFICIAL_AUTHENTICODE_SIGNED=NO'
          Write-Host 'CREATOR_APP_MANIFEST_GENERATED=NO'
          Write-Host 'CREATOR_APP_ED25519_ENVELOPE_GENERATED=NO'
          Write-Host 'CREATOR_OFFICIAL_PUBLISHABLE=NO'

      - name: Prove no private signing material entered publisher handoff
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out/creator-official-candidate'
          $forbidden = @(Get-ChildItem -LiteralPath $out -Recurse -File | Where-Object {
            $_.Extension -in @('.pem', '.key', '.p12', '.pfx', '.dpapi')
          })
          if ($forbidden.Count -ne 0) { throw 'private signing material entered official Creator handoff' }
          if (Get-ChildItem -LiteralPath $out -Recurse -File | Select-String -SimpleMatch 'PRIVATE KEY' -Quiet) {
            throw 'private-key marker entered official Creator handoff'
          }
          if (Test-Path -LiteralPath (Join-Path $out 'creator-app-manifest.json')) { throw 'app manifest was generated before Authenticode verification' }
          if (Test-Path -LiteralPath (Join-Path $out 'creator-app-envelope.json')) { throw 'Ed25519 envelope was generated inside CI before publisher signing' }
          Write-Host 'CREATOR_OFFICIAL_PRIVATE_KEY_MATERIAL=ABSENT'
          Write-Host 'CREATOR_PREMATURE_APP_MANIFEST=ABSENT'
          Write-Host 'CREATOR_PREMATURE_ED25519_ENVELOPE=ABSENT'

      - name: Upload non-publishable official launcher and app for publisher signing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-creator-official-candidate-${{ github.sha }}
          path: out/creator-official-candidate/
          if-no-files-found: error
          retention-days: 7

name: Creator Official Candidate

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/trust/release-ed25519.json'
      - 'docs/contracts/release-trust-policy.json'
      - 'docs/contracts/creator-app-channel.json'
      - 'docs/contracts/creator-component-channel.json'
      - 'docs/contracts/creator-code-signing.json'
      - 'tools/creator/**'
      - 'tools/release-signing/cmd/ordax-creator-app-signing/**'
      - 'tools/release-signing/cmd/ordax-creator-app-manifest/**'
      - '.github/workflows/creator-official-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      trust_sha256: ${{ steps.gate.outputs.trust_sha256 }}
      app_version: ${{ steps.gate.outputs.app_version }}
      app_sequence: ${{ steps.gate.outputs.app_sequence }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require canonical public trust and exact official contracts
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          trust_sha=''
          readarray -t app_values < <(python - <<'PY'
          import json, pathlib, re
          app = json.loads(pathlib.Path('docs/contracts/creator-app-channel.json').read_text(encoding='utf-8'))
          component = json.loads(pathlib.Path('docs/contracts/creator-component-channel.json').read_text(encoding='utf-8'))
          code_signing = json.loads(pathlib.Path('docs/contracts/creator-code-signing.json').read_text(encoding='utf-8'))
          assert app['$schema'] == 'prototype-ordax.creator-app-channel/1'
          assert app['purpose'] == 'creator-app-windows-amd64'
          assert app['release_tag'] == 'creator-app'
          assert app['artifact_name'] == 'OrdaX-Creator-App.exe'
          assert app['envelope_name'] == 'creator-app-envelope.json'
          assert app['launcher_artifact'] == 'OrdaX-Creator.exe'
          assert app['launcher_role'] == 'stable-signed-app-loader'
          assert app['ed25519_signature_required'] is True
          assert app['authenticode_required_before_manifest_generation'] is True
          assert app['development_fallback_allowed_in_official_launcher'] is False
          assert app['in_place_running_executable_replacement_allowed'] is False
          assert app['versioned_install_required'] is True
          assert app['offline_last_known_good_allowed'] is True
          assert app['release_sequence_must_never_decrease'] is True
          assert app['same_sequence_different_commit_allowed'] is False
          assert app['publisher_private_key_in_launcher'] is False
          assert app['publisher_private_key_in_app'] is False
          assert app['publisher_private_key_in_ci_artifact'] is False
          assert app['unsigned_manifest_may_activate_app'] is False
          assert app['publish_allowed'] is False
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', app['version'])
          assert isinstance(app['release_sequence'], int) and not isinstance(app['release_sequence'], bool) and app['release_sequence'] > 0

          assert component['$schema'] == 'prototype-ordax.creator-component-channel/1'
          assert component['purpose'] == 'creator-inspection-windows-amd64'
          assert component['ed25519_signature_required'] is True
          assert component['development_fallback_allowed_in_official_creator'] is False
          assert component['raw_disk_writer_allowed'] is False
          assert component['publisher_private_key_in_consumer'] is False
          assert component['publisher_private_key_in_ci_artifact'] is False
          assert component['unsigned_manifest_may_activate_official_component'] is False

          assert code_signing['$schema'] == 'prototype-ordax.creator-code-signing/2'
          assert code_signing['platform'] == 'windows'
          assert sorted(code_signing['artifacts']) == ['OrdaX-Creator-App.exe', 'OrdaX-Creator.exe']
          assert code_signing['artifact_roles']['OrdaX-Creator.exe'] == 'stable-signed-app-loader'
          assert code_signing['artifact_roles']['OrdaX-Creator-App.exe'] == 'versioned-signed-creator-gui'
          assert code_signing['signature_format'] == 'authenticode'
          assert code_signing['file_digest_algorithm'] == 'sha256'
          assert code_signing['verification']['exact_artifact_name_required'] is True
          assert code_signing['timestamp']['required'] is True
          assert code_signing['timestamp']['protocol'] == 'rfc3161'
          assert code_signing['timestamp']['digest_algorithm'] == 'sha256'
          assert code_signing['custody']['private_key_may_enter_git'] is False
          assert code_signing['custody']['private_key_may_enter_creator'] is False
          assert code_signing['custody']['private_key_may_enter_github_artifact'] is False
          assert code_signing['custody']['pfx_may_enter_git'] is False
          assert code_signing['custody']['pfx_may_enter_github_artifact'] is False
          assert code_signing['custody']['end_user_manages_code_signing_key'] is False
          assert code_signing['release_policy']['unlisted_artifact_publishable'] is False
          assert code_signing['release_policy']['authenticode_is_release_authenticity_root'] is False
          assert code_signing['release_policy']['ed25519_release_verification_remains_required'] is True
          print(app['version'])
          print(app['release_sequence'])
          PY
          )
          app_version="${app_values[0]}"
          app_sequence="${app_values[1]}"

          if [ -f bootstrap/trust/release-ed25519.json ]; then
            python - <<'PY'
          import base64, json, pathlib
          trust = json.loads(pathlib.Path('bootstrap/trust/release-ed25519.json').read_text(encoding='utf-8'))
          policy = json.loads(pathlib.Path('docs/contracts/release-trust-policy.json').read_text(encoding='utf-8'))
          assert trust['$schema'] == 'prototype-ordax.release-trust/1'
          assert trust['key_id'] == policy['canonical_key_id'] == 'ordax-prototype-release-v1'
          assert len(base64.b64decode(trust['public_key_base64'], validate=True)) == 32
          assert policy['consumer_creator']['generates_publisher_private_keys'] is False
          assert policy['consumer_creator']['stores_publisher_private_keys'] is False
          assert policy['consumer_creator']['requests_private_key_backup_from_end_user'] is False
          assert policy['private_key']['end_user_must_never_receive_or_manage_private_key'] is True
          assert policy['gates']['key_material_generated'] is True
          assert policy['gates']['public_anchor_pinned'] is True
          PY
            ready=true
            trust_sha="$(sha256sum bootstrap/trust/release-ed25519.json | cut -d' ' -f1)"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "trust_sha256=$trust_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_sequence=$app_sequence" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then
            echo 'CREATOR_OFFICIAL_TRUST_GATE=READY'
          else
            echo 'CREATOR_OFFICIAL_TRUST_GATE=BLOCKED'
            echo 'CREATOR_OFFICIAL_BINARY_BUILT=NO'
          fi

  handoff-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Exercise exact publisher handoff recipe with disposable public trust
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $app = Get-Content -LiteralPath docs/contracts/creator-app-channel.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $trustPath = Join-Path $env:RUNNER_TEMP 'creator-ci-disposable-trust.json'
          $trust = [ordered]@{
            '$schema' = 'prototype-ordax.release-trust/1'
            key_id = 'ordax-prototype-release-v1'
            public_key_base64 = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($trustPath, (($trust | ConvertTo-Json -Depth 5) + "`n"), $utf8)
          $out = Join-Path $PWD 'out/creator-publisher-handoff-regression'
          & tools/creator/windows/Build-OrdaXCreatorPublisherHandoff.ps1 `
            -TrustPath $trustPath `
            -SourceCommit '${{ github.sha }}' `
            -AppVersion ([string]$app.version) `
            -AppReleaseSequence ([int64]$app.release_sequence) `
            -TrustClass 'ci-disposable' `
            -OutputDirectory $out | Out-Host
          $provenance = Get-Content -LiteralPath (Join-Path $out 'provenance.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($provenance.trust_class -ne 'ci-disposable') { throw 'handoff regression did not record disposable trust class' }
          if ($null -ne $provenance.canonical_trust_sha256) { throw 'disposable handoff incorrectly claimed canonical trust' }
          if ($provenance.publishable_to_end_users -ne $false -or $provenance.authenticode_signed -ne $false) { throw 'disposable handoff became publishable' }
          if (Test-Path -LiteralPath (Join-Path $out 'creator-app-manifest.json')) { throw 'disposable handoff created app manifest before Authenticode' }
          if (Test-Path -LiteralPath (Join-Path $out 'creator-app-envelope.json')) { throw 'disposable handoff created Ed25519 envelope' }
          if (Get-ChildItem -LiteralPath $out -Recurse -File | Where-Object { $_.Extension -in @('.pem', '.key', '.p12', '.pfx', '.dpapi') }) { throw 'secret-looking file entered disposable handoff' }
          Remove-Item -LiteralPath $trustPath -Force
          Write-Host 'CREATOR_HANDOFF_SHARED_RECIPE=PASS'
          Write-Host 'CREATOR_HANDOFF_CANONICAL_TRUST=NO'
          Write-Host 'CREATOR_HANDOFF_PUBLISHABLE=NO'
          Write-Host 'CREATOR_HANDOFF_PRIVATE_KEY=NO'

  build-windows-candidate:
    needs: trust-gate
    if: ${{ needs.trust-gate.outputs.ready == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Build canonical publisher handoff with shared recipe
        shell: pwsh
        env:
          EXPECTED_TRUST_SHA256: ${{ needs.trust-gate.outputs.trust_sha256 }}
          APP_VERSION: ${{ needs.trust-gate.outputs.app_version }}
          APP_SEQUENCE: ${{ needs.trust-gate.outputs.app_sequence }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'out/creator-official-candidate'
          & tools/creator/windows/Build-OrdaXCreatorPublisherHandoff.ps1 `
            -TrustPath bootstrap/trust/release-ed25519.json `
            -SourceCommit '${{ github.sha }}' `
            -AppVersion $env:APP_VERSION `
            -AppReleaseSequence ([int64]$env:APP_SEQUENCE) `
            -TrustClass 'canonical' `
            -OutputDirectory $out | Out-Host
          $provenance = Get-Content -LiteralPath (Join-Path $out 'provenance.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($provenance.trust_class -ne 'canonical') { throw 'canonical handoff did not record canonical trust class' }
          if ([string]$provenance.canonical_trust_sha256 -cne $env:EXPECTED_TRUST_SHA256) { throw 'canonical handoff trust SHA differs from trust gate' }
          if ([string]$provenance.trust_sha256 -cne $env:EXPECTED_TRUST_SHA256) { throw 'canonical handoff embedded trust SHA differs from trust gate' }
          if ($provenance.publishable_to_end_users -ne $false -or $provenance.authenticode_signed -ne $false) { throw 'unsigned canonical handoff became publishable' }
          Write-Host 'CREATOR_OFFICIAL_SHARED_HANDOFF_RECIPE=PASS'
          Write-Host 'CREATOR_OFFICIAL_AUTHENTICODE_SIGNED=NO'
          Write-Host 'CREATOR_OFFICIAL_PUBLISHABLE=NO'

      - name: Upload non-publishable official launcher and app for publisher signing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-creator-official-candidate-${{ github.sha }}
          path: out/creator-official-candidate/
          if-no-files-found: error
          retention-days: 7

name: Creator Development Update Channel

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/**'
      - '.github/workflows/creator-dev-channel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-creator-dev:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test stable GUI read-only updater USB discovery and local trust
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tools/creator
          try {
            go test -count=1 ./...
            go test -count=1 ./host/windows
          } finally {
            Pop-Location
          }

      - name: Build stable graphical launcher and non-destructive development payload
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          $payload = Join-Path $PWD 'out/creator-dev-payload'
          $sha = '${{ github.sha }}'
          $version = 'dev-' + $sha.Substring(0, 12)
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          Push-Location tools/creator
          try {
            go build -trimpath -buildvcs=false `
              -ldflags='-s -w -H=windowsgui' `
              -o ../../out/creator-dev-release/OrdaX-Creator.exe `
              ./cmd/ordax-creator-app

            # Development backend supports USB discovery + local DPAPI trust only.
            # No raw-disk writer is linked.
            go build -trimpath -buildvcs=false `
              -ldflags='-s -w' `
              -o ../../out/creator-dev-payload/ordax-creator-physical-test.exe `
              ./cmd/ordax-creator-inspection
          } finally {
            Pop-Location
          }

          @'
          @echo off
          echo OrdaX Creator internal diagnostic. Use OrdaX-Creator.exe normally.
          "%~dp0ordax-creator-physical-test.exe" targets
          '@ | Set-Content -Encoding ascii (Join-Path $payload '1-Inspect-OrdaXUSB.cmd')

          @'
          @echo off
          echo Release trust is configured from the graphical OrdaX Creator.
          echo No terminal workflow is required.
          exit /b 1
          '@ | Set-Content -Encoding ascii (Join-Path $payload '2-Initialize-OrdaXTrust.cmd')

          @"
          OrdaX Creator - development payload

          Normal usage is through OrdaX-Creator.exe.
          The launcher is stable and does not modify or replace itself.
          Versioned internal components update automatically under the user profile.

          DEVELOPMENT CHANNEL:
          - USB discovery: enabled
          - local release identity: enabled through Windows DPAPI
          - raw private PEM files: NO
          - release signing/publishing tool: NO
          - raw-disk writer linked: NO
          - physical write: NO
          "@ | Set-Content -Encoding utf8 (Join-Path $payload 'README.txt')

          $zip = Join-Path $release 'ordax-creator-dev-windows-amd64.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $zip -CompressionLevel Optimal
          $payloadHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $payloadSize = (Get-Item -LiteralPath $zip).Length

          $manifest = [ordered]@{
            '$schema' = 'prototype-ordax.creator-update-channel/1'
            channel = 'development'
            version = $version
            source_commit = $sha
            payload = [ordered]@{
              url = 'https://github.com/washingtonmsdj/prototipo-ordax-os/releases/download/creator-dev/ordax-creator-dev-windows-amd64.zip'
              sha256 = $payloadHash
              size = $payloadSize
            }
            entrypoints = [ordered]@{
              inspect = '1-Inspect-OrdaXUSB.cmd'
              trust = '2-Initialize-OrdaXTrust.cmd'
              status = 'ordax-creator-physical-test.exe'
            }
          }

          $creatorPath = Join-Path $release 'OrdaX-Creator.exe'
          $creatorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $creatorPath).Hash.ToLowerInvariant()
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $release 'creator-dev-manifest.json'), (($manifest | ConvertTo-Json -Depth 6) + "`n"), $utf8NoBom)
          @(
            "$creatorHash  OrdaX-Creator.exe",
            "$payloadHash  ordax-creator-dev-windows-amd64.zip"
          ) | Set-Content -Encoding ascii (Join-Path $release 'SHA256SUMS')

      - name: Prove local trust is DPAPI protected and physical write is absent
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          $payload = Join-Path $PWD 'out/creator-dev-payload'
          $backend = Join-Path $payload 'ordax-creator-physical-test.exe'

          foreach ($required in @(
            (Join-Path $release 'OrdaX-Creator.exe'),
            (Join-Path $release 'creator-dev-manifest.json'),
            $backend
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "required Creator artifact is missing: $required"
            }
          }

          foreach ($forbidden in @(
            (Join-Path $payload 'ordax-creator-self-update.exe'),
            (Join-Path $payload 'ordax-release-signing.exe'),
            (Join-Path $release 'creator-app.json')
          )) {
            if (Test-Path -LiteralPath $forbidden) {
              throw "unsafe development-channel artifact unexpectedly present: $forbidden"
            }
          }

          $status = & $backend status | ConvertFrom-Json
          if ($status.raw_backend_linked -ne $false) { throw 'development backend unexpectedly links raw writer' }
          if ($status.build.physical_write_authorized -ne $false) { throw 'development backend unexpectedly authorizes physical write' }
          if ($status.build.ready -ne $false) { throw 'development backend unexpectedly reports ready' }

          $testProfile = Join-Path $PWD 'out/creator-dev-trust-test-profile'
          New-Item -ItemType Directory -Force -Path $testProfile | Out-Null
          $oldUserProfile = $env:USERPROFILE
          try {
            $env:USERPROFILE = $testProfile
            $before = & $backend trust-status | ConvertFrom-Json
            if ($before.configured -ne $false) { throw 'fresh isolated trust profile unexpectedly configured' }

            $after = & $backend trust-init | ConvertFrom-Json
            if ($after.configured -ne $true -or $after.valid -ne $true) { throw 'local trust initialization failed' }
            if ($after.private_key_protected -ne $true) { throw 'private key is not protected' }
            if ($after.private_key_protection -ne 'windows-dpapi-current-user') { throw 'unexpected private-key protection provider' }
            if ($after.proof_verified -ne $true) { throw 'local signing proof was not verified' }
            if ($after.offline_backup_required -ne $true) { throw 'offline recovery gate unexpectedly absent' }
            if ($after.ready_to_pin_public_anchor -ne $false) { throw 'public anchor became pinnable before recovery backup' }
            if ([string]$after.public_trust_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'invalid public trust hash' }

            $publicTrust = Join-Path $testProfile 'OrdaX-Creator/trust-review/release-ed25519.json'
            $protectedKey = Join-Path $testProfile 'OrdaX-Private/release-signing/ordax-release-private.dpapi'
            if (-not (Test-Path -LiteralPath $publicTrust -PathType Leaf)) { throw 'public trust file missing' }
            if (-not (Test-Path -LiteralPath $protectedKey -PathType Leaf)) { throw 'DPAPI-protected private key missing' }
            if (@(Get-ChildItem -LiteralPath $testProfile -Recurse -File -Filter '*.pem').Count -ne 0) {
              throw 'raw PEM private key unexpectedly created'
            }

            $again = & $backend trust-status | ConvertFrom-Json
            if ($again.public_trust_sha256 -ne $after.public_trust_sha256) { throw 'persisted trust identity changed after validation' }
          } finally {
            $env:USERPROFILE = $oldUserProfile
            Remove-Item -LiteralPath $testProfile -Recurse -Force -ErrorAction SilentlyContinue
          }

          Write-Host 'CREATOR_STABLE_GUI=PASS'
          Write-Host 'CREATOR_SELF_REPLACEMENT=ABSENT'
          Write-Host 'CREATOR_LOCAL_TRUST_DPAPI=PASS'
          Write-Host 'CREATOR_RAW_PRIVATE_PEM=ABSENT'
          Write-Host 'CREATOR_DEV_RAW_DISK_BACKEND=ABSENT'
          Write-Host 'CREATOR_DEV_PHYSICAL_WRITE=BLOCKED'

      - name: Publish rolling non-destructive Creator development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          gh release view creator-dev --repo washingtonmsdj/prototipo-ordax-os *> $null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            gh release create creator-dev `
              --repo washingtonmsdj/prototipo-ordax-os `
              --target '${{ github.sha }}' `
              --title 'OrdaX Creator Development Channel' `
              --prerelease `
              --notes 'Portable graphical OrdaX Creator. Stable launcher; internal non-destructive components update automatically. Physical write is not present in this channel.'
            if ($LASTEXITCODE -ne 0) { throw 'failed to create creator-dev release' }
          }

          gh release upload creator-dev `
            (Join-Path $release 'OrdaX-Creator.exe') `
            (Join-Path $release 'ordax-creator-dev-windows-amd64.zip') `
            (Join-Path $release 'SHA256SUMS') `
            --repo washingtonmsdj/prototipo-ordax-os `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'failed to upload Creator launcher/payload' }

          # Manifest is the atomic pointer and is published last.
          gh release upload creator-dev `
            (Join-Path $release 'creator-dev-manifest.json') `
            --repo washingtonmsdj/prototipo-ordax-os `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'failed to publish Creator payload manifest' }

          gh release delete-asset creator-dev creator-app.json `
            --repo washingtonmsdj/prototipo-ordax-os `
            --yes 2>$null
          $global:LASTEXITCODE = 0

          Write-Host 'CREATOR_DEV_CHANNEL_PUBLISHED=YES'
          Write-Host 'CREATOR_NATIVE_GUI=YES'
          Write-Host 'CREATOR_LAUNCHER_SELF_MODIFIES=NO'
          Write-Host 'CREATOR_LOCAL_TRUST_UI=YES'
          Write-Host 'CREATOR_DEV_CHANNEL_CAN_AUTHORIZE_PHYSICAL_WRITE=NO'

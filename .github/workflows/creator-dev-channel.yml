name: Creator Development Update Channel

on:
  push:
    branches: [main]
    paths:
      - 'tools/creator/**'
      - '.github/workflows/creator-dev-channel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-creator-dev:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Test stable GUI updater and USB discovery
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Push-Location tools/creator
          try {
            go test -count=1 ./...
            go test -count=1 ./host/windows
          } finally {
            Pop-Location
          }

      - name: Build stable graphical launcher and read-only development payload
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          $payload = Join-Path $PWD 'out/creator-dev-payload'
          $sha = '${{ github.sha }}'
          $version = 'dev-' + $sha.Substring(0, 12)
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          Push-Location tools/creator
          try {
            go build -trimpath -buildvcs=false `
              -ldflags='-s -w -H=windowsgui' `
              -o ../../out/creator-dev-release/OrdaX-Creator.exe `
              ./cmd/ordax-creator-app

            go build -trimpath -buildvcs=false `
              -ldflags='-s -w' `
              -o ../../out/creator-dev-payload/ordax-creator-physical-test.exe `
              ./cmd/ordax-creator-inspection
          } finally {
            Pop-Location
          }

          @'
          @echo off
          echo OrdaX Creator internal diagnostic. Use OrdaX-Creator.exe normally.
          "%~dp0ordax-creator-physical-test.exe" targets
          '@ | Set-Content -Encoding ascii (Join-Path $payload '1-Inspect-OrdaXUSB.cmd')

          # Protocol /1 required a third entrypoint named "trust". Keep a harmless
          # compatibility file so already-downloaded launchers continue updating.
          # It contains no key generation, signing, backup, or trust ceremony.
          @'
          @echo off
          rem Legacy updater protocol compatibility only. No user action is required.
          exit /b 0
          '@ | Set-Content -Encoding ascii (Join-Path $payload '2-Legacy-Protocol-Compatibility.cmd')

          @"
          OrdaX Creator - development payload

          Normal usage is through OrdaX-Creator.exe.
          Versioned non-destructive components update automatically under the user profile.

          DEVELOPMENT CHANNEL:
          - USB discovery: enabled
          - publisher key generation/custody: NO
          - end-user key or backup setup: NO
          - raw private key material: NO
          - release signing tool: NO
          - raw-disk writer linked: NO
          - physical write: NO
          - legacy updater compatibility: non-privileged no-op only
          "@ | Set-Content -Encoding utf8 (Join-Path $payload 'README.txt')

          $zip = Join-Path $release 'ordax-creator-dev-windows-amd64.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $zip -CompressionLevel Optimal
          $payloadHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $payloadSize = (Get-Item -LiteralPath $zip).Length

          # Keep the rolling endpoint on protocol /1 until all already-distributed
          # launchers have crossed a future explicit bootstrap compatibility boundary.
          $manifest = [ordered]@{
            '$schema' = 'prototype-ordax.creator-update-channel/1'
            channel = 'development'
            version = $version
            source_commit = $sha
            payload = [ordered]@{
              url = 'https://github.com/washingtonmsdj/prototipo-ordax-os/releases/download/creator-dev/ordax-creator-dev-windows-amd64.zip'
              sha256 = $payloadHash
              size = $payloadSize
            }
            entrypoints = [ordered]@{
              inspect = '1-Inspect-OrdaXUSB.cmd'
              trust = '2-Legacy-Protocol-Compatibility.cmd'
              status = 'ordax-creator-physical-test.exe'
            }
          }

          $creatorPath = Join-Path $release 'OrdaX-Creator.exe'
          $creatorHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $creatorPath).Hash.ToLowerInvariant()
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $release 'creator-dev-manifest.json'), (($manifest | ConvertTo-Json -Depth 6) + "`n"), $utf8NoBom)
          @(
            "$creatorHash  OrdaX-Creator.exe",
            "$payloadHash  ordax-creator-dev-windows-amd64.zip"
          ) | Set-Content -Encoding ascii (Join-Path $release 'SHA256SUMS')

      - name: Prove consumer payload is non-destructive and contains no publisher key capability
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          $payload = Join-Path $PWD 'out/creator-dev-payload'
          $backend = Join-Path $payload 'ordax-creator-physical-test.exe'
          $compat = Join-Path $payload '2-Legacy-Protocol-Compatibility.cmd'

          foreach ($required in @(
            (Join-Path $release 'OrdaX-Creator.exe'),
            (Join-Path $release 'creator-dev-manifest.json'),
            $backend,
            $compat
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "required Creator artifact is missing: $required"
            }
          }

          foreach ($forbidden in @(
            (Join-Path $payload 'ordax-creator-self-update.exe'),
            (Join-Path $payload 'ordax-release-signing.exe'),
            (Join-Path $payload '2-Initialize-OrdaXTrust.cmd'),
            (Join-Path $release 'creator-app.json')
          )) {
            if (Test-Path -LiteralPath $forbidden) {
              throw "forbidden consumer artifact unexpectedly present: $forbidden"
            }
          }

          foreach ($pattern in @('*.pem','*.key','*.p12','*.pfx','*.dpapi')) {
            if (@(Get-ChildItem -LiteralPath $payload -Recurse -File -Filter $pattern).Count -ne 0) {
              throw "publisher/private key material unexpectedly present in consumer payload: $pattern"
            }
          }

          $compatText = Get-Content -LiteralPath $compat -Raw
          foreach ($forbiddenText in @('generate-key','release-signing.exe','private.pem','trust-init')) {
            if ($compatText -match [regex]::Escape($forbiddenText)) {
              throw "legacy compatibility entrypoint gained forbidden key capability: $forbiddenText"
            }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $release 'creator-dev-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.'$schema' -ne 'prototype-ordax.creator-update-channel/1') { throw 'rolling compatibility manifest must remain schema /1' }
          if ($manifest.entrypoints.trust -ne '2-Legacy-Protocol-Compatibility.cmd') { throw 'legacy protocol entrypoint is not the approved no-op' }

          $status = & $backend status | ConvertFrom-Json
          if ($status.raw_backend_linked -ne $false) { throw 'development backend unexpectedly links raw writer' }
          if ($status.build.physical_write_authorized -ne $false) { throw 'development backend unexpectedly authorizes physical write' }
          if ($status.build.ready -ne $false) { throw 'development backend unexpectedly reports ready' }

          Write-Host 'CREATOR_STABLE_GUI=PASS'
          Write-Host 'CREATOR_SELF_REPLACEMENT=ABSENT'
          Write-Host 'CREATOR_CONSUMER_PUBLISHER_KEY_CAPABILITY=ABSENT'
          Write-Host 'CREATOR_CONSUMER_KEY_SETUP=NO'
          Write-Host 'CREATOR_UPDATE_PROTOCOL_LEGACY_COMPAT=PASS'
          Write-Host 'CREATOR_DEV_RAW_DISK_BACKEND=ABSENT'
          Write-Host 'CREATOR_DEV_PHYSICAL_WRITE=BLOCKED'

      - name: Publish rolling read-only Creator development channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'out/creator-dev-release'
          gh release view creator-dev --repo washingtonmsdj/prototipo-ordax-os *> $null
          if ($LASTEXITCODE -ne 0) {
            $global:LASTEXITCODE = 0
            gh release create creator-dev `
              --repo washingtonmsdj/prototipo-ordax-os `
              --target '${{ github.sha }}' `
              --title 'OrdaX Creator Development Channel' `
              --prerelease `
              --notes 'Portable graphical OrdaX Creator. Stable launcher; versioned read-only development payload updates automatically. Physical write and publisher signing keys are not present in this channel.'
            if ($LASTEXITCODE -ne 0) { throw 'failed to create creator-dev release' }
          }

          gh release upload creator-dev `
            (Join-Path $release 'OrdaX-Creator.exe') `
            (Join-Path $release 'ordax-creator-dev-windows-amd64.zip') `
            (Join-Path $release 'SHA256SUMS') `
            --repo washingtonmsdj/prototipo-ordax-os `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'failed to upload Creator launcher/payload' }

          gh release upload creator-dev `
            (Join-Path $release 'creator-dev-manifest.json') `
            --repo washingtonmsdj/prototipo-ordax-os `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'failed to publish Creator payload manifest' }

          gh release delete-asset creator-dev creator-app.json `
            --repo washingtonmsdj/prototipo-ordax-os `
            --yes 2>$null
          $global:LASTEXITCODE = 0

          Write-Host 'CREATOR_DEV_CHANNEL_PUBLISHED=YES'
          Write-Host 'CREATOR_NATIVE_GUI=YES'
          Write-Host 'CREATOR_LAUNCHER_SELF_MODIFIES=NO'
          Write-Host 'CREATOR_CONSUMER_KEY_SETUP=NO'
          Write-Host 'CREATOR_DEV_CHANNEL_CAN_AUTHORIZE_PHYSICAL_WRITE=NO'

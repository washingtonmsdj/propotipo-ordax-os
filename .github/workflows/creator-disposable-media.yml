name: Creator Disposable Media

on:
  push:
    branches: [main]
    paths:
      - 'docs/contracts/physical-media.json'
      - 'tools/creator/**'
      - 'tests/test_physical_media_contract.py'
      - '.github/workflows/creator-disposable-media.yml'
  pull_request:
    paths:
      - 'docs/contracts/physical-media.json'
      - 'tools/creator/**'
      - 'tests/test_physical_media_contract.py'
      - '.github/workflows/creator-disposable-media.yml'

permissions:
  contents: read

jobs:
  disposable-media:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install disposable media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk dosfstools e2fsprogs mtools util-linux

      - name: Validate physical-media regressions
        run: python -m unittest discover -s tests -p 'test_physical_media_contract.py' -v

      - name: Build fully resolved Creator fixture payload
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/creator-fixture-payload"
          mkdir -p "$payload/esp" "$payload/main"
          printf 'synthetic-uefi-proof\n' > "$payload/esp/BOOTX64.EFI"
          printf '#!/bin/sh\nexit 0\n' > "$payload/main/entrypoint"
          printf '#!/bin/sh\nexit 0\n' > "$payload/main/recovery-entrypoint"
          chmod 0755 "$payload/main/entrypoint" "$payload/main/recovery-entrypoint"

          python - "$payload" "$RUNNER_TEMP/creator-fixture-manifest.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          payload = pathlib.Path(sys.argv[1])
          manifest_path = pathlib.Path(sys.argv[2])

          def digest(relative):
              return hashlib.sha256((payload / relative).read_bytes()).hexdigest()

          manifest = {
              "$schema": "prototype-ordax.minimal-bootstrap/4",
              "status": "disposable-test-fixture",
              "physical_write_allowed": False,
              "all_artifacts_resolved": True,
              "policy": "minimum-release-acquisition-first",
              "partitions": [
                  {"name": "ORDAX-ESP", "role": "ESP"},
                  {"name": "ORDAX", "role": "MAIN"},
              ],
              "required_capabilities_before_first_release": [],
              "optional_after_first_release": [],
              "boot_policy": {},
              "artifact_groups": [
                  {
                      "id": "esp-test",
                      "partition": "ORDAX-ESP",
                      "source_owner": "creator-disposable-media-test",
                      "resolved": True,
                      "artifacts": [
                          {
                              "source_path": "esp/BOOTX64.EFI",
                              "target_path": "/EFI/BOOT/BOOTX64.EFI",
                              "sha256": digest("esp/BOOTX64.EFI"),
                              "mode": "0644",
                              "logical_owner": "esp",
                              "reason": "synthetic disposable GPT/filesystem proof",
                          }
                      ],
                  },
                  {
                      "id": "bootstrap-test",
                      "partition": "ORDAX",
                      "source_owner": "creator-disposable-media-test",
                      "resolved": True,
                      "artifacts": [
                          {
                              "source_path": "main/entrypoint",
                              "target_path": "/ordax/bootstrap/entrypoint",
                              "sha256": digest("main/entrypoint"),
                              "mode": "0755",
                              "logical_owner": "bootstrap",
                              "reason": "synthetic disposable GPT/filesystem proof",
                          },
                          {
                              "source_path": "main/recovery-entrypoint",
                              "target_path": "/ordax/bootstrap/recovery/entrypoint",
                              "sha256": digest("main/recovery-entrypoint"),
                              "mode": "0755",
                              "logical_owner": "recovery",
                              "reason": "synthetic disposable GPT/filesystem proof",
                          },
                      ],
                  },
              ],
              "runtime_roots_created_empty": [
                  "/ordax/releases",
                  "/ordax/state",
                  "/ordax/home",
              ],
              "current_pointer_initial_state": "unset",
              "forbidden_initial_payload": [],
              "resolution_requirements_per_artifact": [],
              "write_gate": {
                  "requires_all_groups_resolved": True,
                  "requires_all_artifact_hashes": True,
                  "requires_disposable_layout_proof": True,
                  "requires_explicit_destructive_authorization": True,
              },
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Materialize disposable tree through Creator Core
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/creator-fixture-payload"
          manifest="$RUNNER_TEMP/creator-fixture-manifest.json"
          stage="$RUNNER_TEMP/ordax-stage"
          pushd tools/creator >/dev/null
          output="$(go run ./cmd/ordax-creator stage-tree \
            --manifest "$manifest" \
            --payload-root "$payload" \
            --output-root "$stage")"
          popd >/dev/null
          printf '%s\n' "$output"
          grep -q '^DISPOSABLE_TREE_STAGED=YES$' <<<"$output"
          grep -q '^GPT_FILESYSTEM_PROOF=NO$' <<<"$output"
          grep -q '^PHYSICAL_WRITE_STATUS=blocked$' <<<"$output"
          test -d "$stage/ORDAX-ESP"
          test -d "$stage/ORDAX/releases"
          test -d "$stage/ORDAX/state"
          test -d "$stage/ORDAX/home"
          printf '%s\n' "$stage" > "$RUNNER_TEMP/stage-path"

      - name: Prove GPT, FAT32, ext4, labels and post-materialization hashes
        run: |
          set -euo pipefail
          stage="$(cat "$RUNNER_TEMP/stage-path")"
          output="$RUNNER_TEMP/ordax-proof"
          python tools/creator/proof/disposable_media.py \
            --contract docs/contracts/physical-media.json \
            --stage-root "$stage" \
            --output-root "$output"
          python - "$output/proof.json" <<'PY'
          import json
          import pathlib
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert proof["status"] == "pass"
          assert proof["physical_write_authorized"] is False
          assert proof["partition_table"] == "gpt"
          assert [p["name"] for p in proof["partitions"]] == ["ORDAX-ESP", "ORDAX"]
          assert [p["filesystem"]["type"] for p in proof["partitions"]] == ["vfat", "ext4"]
          assert [p["filesystem"]["label"] for p in proof["partitions"]] == ["ORDAX-ESP", "ORDAX"]
          assert all(proof["checks"].values())
          print("DISPOSABLE_MEDIA_PROOF=PASS")
          PY

      - name: Publish proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: creator-disposable-media-proof
          path: ${{ runner.temp }}/ordax-proof/proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Assert raw image is not published as a CI artifact
        run: |
          test -f "$RUNNER_TEMP/ordax-proof/ordax-disposable.raw"
          echo "RAW_IMAGE_EXISTS_ONLY_IN_EPHEMERAL_RUNNER=YES"
          rm -f "$RUNNER_TEMP/ordax-proof/ordax-disposable.raw"

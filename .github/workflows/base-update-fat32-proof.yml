name: Base Update FAT32 Proof

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/base-update/**'
      - 'bootstrap/release-acquisition/**'
      - 'system/services/base-update/*.py'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - 'docs/contracts/base-update.json'
      - 'tests/test_base_update_*.py'
      - '.github/workflows/base-update-fat32-proof.yml'
  pull_request:
    paths:
      - 'bootstrap/base-update/**'
      - 'bootstrap/release-acquisition/**'
      - 'system/services/base-update/*.py'
      - 'tools/release-manifest/**'
      - 'tools/release-signing/**'
      - 'docs/contracts/base-update.json'
      - 'tests/test_base_update_*.py'
      - '.github/workflows/base-update-fat32-proof.yml'

permissions:
  contents: read

concurrency:
  group: base-update-fat32-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fat32-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false

      - name: Install disposable FAT32 proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools e2fsprogs fdisk util-linux

      - name: Prove read-only ESP preflight on a disposable same-disk layout
        run: |
          bash bootstrap/base-update/prove_esp_readonly_preflight.sh \
            out/base-update/esp-readonly-preflight-proof.json

      - name: Run base update regressions
        run: |
          python -m unittest tests.test_base_update_contract -v
          python -m unittest tests.test_base_update_plan -v
          python -m unittest tests.test_base_update_stage -v
          python -m unittest tests.test_base_update_dev_stage -v
          python -m unittest tests.test_base_update_esp_discovery -v
          python -m unittest tests.test_base_update_esp_layout -v

      - name: Prove staging on disposable FAT32 loop image
        run: |
          bash bootstrap/base-update/prove_fat32_staging.sh \
            out/base-update/fat32-staging-proof.json

      - name: Build signed release verification tools
        run: |
          set -euo pipefail
          mkdir -p out/base-update-proof
          (cd tools/release-manifest && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/base-update-proof/ordax-release-manifest .)
          (cd tools/release-signing && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/base-update-proof/ordax-release-signing .)
          (cd bootstrap/release-acquisition && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o ../../out/base-update-proof/ordax-release-agent .)

      - name: Prove signed release verification through product CLI on FAT32
        run: |
          bash bootstrap/base-update/prove_signed_fat32_staging.sh \
            out/base-update/signed-fat32-staging-proof.json \
            out/base-update-proof/ordax-release-signing \
            out/base-update-proof/ordax-release-manifest \
            out/base-update-proof/ordax-release-agent

      - name: Validate signed staging proof boundaries
        run: |
          python - out/base-update/signed-fat32-staging-proof.json <<'PY'
          import json
          import pathlib
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert proof["$schema"] == "prototype-ordax.base-update-signed-fat32-proof/1"
          assert proof["status"] == "pass"
          assert proof["scope"] == "signed-release-to-filesystem-staging"
          assert all(proof["checks"].values())
          boundary = proof["trust_boundary"]
          assert boundary["test_key_scope"] == "ci-ephemeral-only"
          assert boundary["canonical_runtime_paths_exercised"] is True
          assert boundary["canonical_release_trust_exercised"] is False
          assert boundary["canonical_public_anchor_promoted"] is False
          assert boundary["physical_write_authorized"] is False
          assert boundary["real_hardware_touched"] is False
          assert boundary["physical_hardware_proven"] is False
          print("BASE_UPDATE_SIGNED_FAT32_PROOF=PASS")
          PY

      - name: Validate evidence-only proof metadata
        run: |
          python - out/base-update/fat32-staging-proof.json <<'PY'
          import json
          import pathlib
          import sys

          proof = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert proof["$schema"] == "prototype-ordax.base-update-fat32-staging-proof/2"
          assert proof["status"] == "pass"
          assert proof["scope"] == "filesystem-staging-only"
          assert proof["filesystem"] == "fat32"
          assert proof["filesystem_label"] == "ORDAX-ESP"
          assert all(proof["checks"].values())
          assert proof["trust_boundary"]["canonical_release_trust_exercised"] is False
          assert proof["trust_boundary"]["release_signature_verification_exercised"] is False
          assert proof["trust_boundary"]["product_cli_trust_requirement_changed"] is False
          assert proof["real_hardware_touched"] is False
          assert proof["physical_hardware_proven"] is False
          assert proof["physical_write_authorized"] is False
          print("BASE_UPDATE_FAT32_PROOF=PASS")
          PY

      - name: Upload proof metadata only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-base-update-fat32-proof-${{ github.sha }}
          path: |
            out/base-update/fat32-staging-proof.json
            out/base-update/signed-fat32-staging-proof.json
            out/base-update/esp-readonly-preflight-proof.json
          if-no-files-found: error
          retention-days: 14
